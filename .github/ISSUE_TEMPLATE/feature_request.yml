name: Feature request
description: Suggest an improvement or new capability for the demo pipeline.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      placeholder: What problem does this feature solve?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      placeholder: Describe the change you propose.
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Scope / non-goals
      placeholder: What is in scope and what is out of scope?
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional context
    validations:
      required: false
